<div class="subscribe-box">
  <div class="subscribe-box-header">
    <h3>Subscribe to new posts</h3>

  </div>
  <form action="https://buttondown.com/api/emails/embed-subscribe/shayshoon" method="post" target="_blank"

        spellcheck="false" aria-label="Your email address" required />
      <button type="submit" class="subscribe-submit-btn">Subscribe</button>

    <div class="subscribe-footer-note">
      <span>Or follow along via <a href="/feed.xml" target="_blank" rel="noopener">📡 RSS Feed</a></span>
      <span class="powered-by-sub"> &bull; Powered by <a href="https://buttondown.com/refer/shayshoon" target="_blank"
          rel="noopener">Buttondown</a></span>

  </form>
