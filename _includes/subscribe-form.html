<div class="subscribe-box">
  <div class="subscribe-box-header">
    <h3>Subscribe to new posts</h3>
    <p>Get an email notification whenever I publish a new post. No spam, unsubscribe anytime.</p>
  </div>
  <form
    action="{{ site.subscribe_action_url | default: 'https://script.google.com/macros/s/AKfycbyI2t_KUB7w0onmvN3ETfVcyF_iknvgMlPycRZakf8I-Nmyha03QF1RIzuuFJ1-gZhAUw/exec' }}"
    method="post" class="subscribe-form">
    <div class="subscribe-form-row">
      <input type="email" name="email" class="subscribe-input" placeholder="Enter your email" spellcheck="false"
        aria-label="Your email address" required />
      <button type="submit" class="subscribe-submit-btn">Subscribe</button>
    </div>
    <div class="subscribe-status-msg" style="display: none;"></div>
    <div class="subscribe-footer-note">
      <span>Or follow along via <a href="/feed.xml" target="_blank" rel="noopener">📡 RSS Feed</a></span>
    </div>
  </form>
</div>
