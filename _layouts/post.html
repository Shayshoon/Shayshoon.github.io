<!DOCTYPE html>
<html lang="en">
<head>
<base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.summary | default: 'A journal entry.' | escape }}">
  <title>{{ page.title }} — Shay's Digital Home</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="alternate" type="application/rss+xml" title="RSS Feed" href="/feed.xml">
</base>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>

  <site-header></site-header>

  <main id="main-content" class="content-wrapper">
    <div id="post-meta">
      <div class="journal-post-meta">
        <h1>{{ page.title }}</h1>
        <div class="meta-line">
          <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
          {% if page.time %}<span class="journal-time">{{ page.time }}</span>{% endif %}
          {% if page.location %}<span class="journal-location">📍 {{ page.location }}</span>{% endif %}
        </div>
      </div>
    </div>
    
    <div id="post-content" class="journal-content">
      {{ content }}
    </div>

    <p style="margin-top: 2rem;"><a href="/journal/">← Back to Journal</a></p>
  </main>

  <site-footer></site-footer>

  <script src="/assets/js/components.js" defer></script>
  <script src="/assets/js/main.js" defer></script>
</body>
</html>
