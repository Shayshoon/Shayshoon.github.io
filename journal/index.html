<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A chronological journal with entries written in Markdown.">
  <title>Journal — Shay's Digital Home</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="alternate" type="application/rss+xml" title="RSS Feed" href="/feed.xml">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>

  <site-header></site-header>

  <main id="main-content" class="content-wrapper">
    <h1>Journal</h1>
    <p>A chronological log of thoughts, discoveries, and moments. Each entry is written in Markdown and rendered right here in your browser — no build step, no server needed.</p>
    <noscript>
      <p>This journal requires JavaScript to render Markdown posts. The raw .md files are available in the /journal/posts/ directory.</p>
    </noscript>
    <div id="journal-list" class="journal-list">
      <p class="journal-loading">Loading entries...</p>
    </div>
  </main>

  <site-footer></site-footer>

  <script src="/assets/js/components.js" defer></script>
  <script src="/assets/js/main.js" defer></script>
  <script src="/assets/js/marked.min.js" defer></script>
  <script src="/assets/js/journal.js" defer></script>
</body>
</html>
